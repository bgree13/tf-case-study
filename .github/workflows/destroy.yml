name: Destroy Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Select yes to destroy the tf-case-study app resources
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_destroy == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Destroy Apply
        run: terraform apply -input=false destroy.tfplan
